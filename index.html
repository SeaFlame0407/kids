<title>角色名冊</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: sticky header + horizontal 家長 tab rail + responsive character-card grid */
:root{
  --bg:#f6f5fb; --surface:#ffffff; --surface-2:#f0edf8; --fg:#221f2b; --muted:#6c6677;
  --border:#e5e1ef; --accent:#6d5bd0; --accent-soft:#ece8fb;
  --dragon:#c98a1e; --dragon-bg:#f8edd6; --rabbit:#c85c82; --rabbit-bg:#fae2ea;
  --cat:#1f8d84; --cat-bg:#d8f1ee; --elf:#4f9a3f; --elf-bg:#e2f3dc;
  --font-disp:"Noto Serif TC",serif; --font-body:"Noto Sans TC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131c; --surface:#201d2a; --surface-2:#282334; --fg:#ece9f2; --muted:#a39daf;
  --border:#322d41; --accent:#a394f2; --accent-soft:#2a2442;
  --dragon:#e4b35c; --dragon-bg:#352a17; --rabbit:#ed93b1; --rabbit-bg:#3a2029;
  --cat:#52c7bc; --cat-bg:#16302d; --elf:#7cc96c; --elf-bg:#1d2f18; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#15131c; --surface:#201d2a; --surface-2:#282334; --fg:#ece9f2; --muted:#a39daf;
  --border:#322d41; --accent:#a394f2; --accent-soft:#2a2442;
  --dragon:#e4b35c; --dragon-bg:#352a17; --rabbit:#ed93b1; --rabbit-bg:#3a2029;
  --cat:#52c7bc; --cat-bg:#16302d; --elf:#7cc96c; --elf-bg:#1d2f18; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);line-height:1.5;margin:0}
.wrap{max-width:960px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
header{padding-block:22px 10px}
h1{font-family:var(--font-disp);font-weight:700;font-size:clamp(1.5rem,5vw,2rem);margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:.9rem;margin-top:4px}
.sub a{color:var(--accent);text-decoration:none}.sub a:hover{text-decoration:underline}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:.85rem;color:var(--muted)}
.stats b{color:var(--fg);font-size:1.05rem;font-variant-numeric:tabular-nums}
.note{margin-top:12px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:10px 13px;font-size:.82rem;color:var(--muted)}
.note b{color:var(--fg)}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;gap:7px;overflow-x:auto;padding:12px 0;margin-top:4px;
  border-bottom:1px solid var(--border);scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--border);background:var(--surface);color:var(--fg);
  font:inherit;font-size:.9rem;padding:7px 14px;border-radius:999px;cursor:pointer;white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:.15s}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tab .c{font-size:.75rem;background:var(--surface-2);color:var(--muted);border-radius:999px;
  padding:1px 7px;font-variant-numeric:tabular-nums}
.tab[aria-selected="true"] .c{background:rgba(255,255,255,.25);color:#fff}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;
  padding-block:20px 48px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 14px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;min-width:0}
.ava{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--font-disp);font-size:1.6rem;font-weight:700;color:#fff;
  position:relative;flex:0 0 auto}
.ava::after{content:"待補";position:absolute;bottom:-3px;right:-3px;background:var(--surface-2);
  color:var(--muted);font-family:var(--font-body);font-size:.58rem;font-weight:400;
  border:1px solid var(--border);border-radius:999px;padding:1px 6px}
.name{font-family:var(--font-disp);font-weight:600;font-size:1.02rem;line-height:1.3;
  word-break:break-word;min-width:0}
.owner{font-size:.76rem;color:var(--muted)}
.owner span{color:var(--fg)}
.badge{font-size:.76rem;padding:3px 10px;border-radius:999px;font-weight:500}
.r-dragon{color:var(--dragon);background:var(--dragon-bg)}
.r-rabbit{color:var(--rabbit);background:var(--rabbit-bg)}
.r-cat{color:var(--cat);background:var(--cat-bg)}
.r-elf{color:var(--elf);background:var(--elf-bg)}
.r-other{color:var(--muted);background:var(--surface-2)}
.src{font-size:.75rem;color:var(--muted);padding-bottom:28px}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px;vertical-align:middle}
.live.on{background:var(--elf)}
</style>

<div class="wrap">
  <header>
    <h1>角色名冊</h1>
    <div class="sub">依家長分頁瀏覽 · 資料來自
      <a href="https://docs.google.com/spreadsheets/d/1bLLdaiUOdhQf9qHReg1N2fknEhCBU4TOJmwATcwbIMg/edit" target="_blank">Google 試算表</a>
    </div>
    <div class="stats">
      <span><b id="st-char">0</b> 位角色</span>
      <span><b id="st-owner">0</b> 位家長</span>
      <span><b id="st-race">0</b> 種種族</span>
    </div>
  </header>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div class="grid" id="grid"></div>
  <div class="src"><span class="live" id="live"></span><span id="src-txt">顯示內建快照資料</span></div>
</div>

<script>
// 從試算表抓下來的快照(第一幀一定完整)。部署到 GitHub Pages 後會再嘗試即時讀取並覆蓋。
const SNAPSHOT = [
  {owner:"赫米娜", name:"赫米娜", race:"龍女"},
  {owner:"77", name:"77", race:"龍女"},
  {owner:"77", name:"淡皋", race:"男精"},
  {owner:"77", name:"涅斯特", race:"兔男(黑兔)"},
  {owner:"77", name:"希洛", race:"兔男(白兔)"},
  {owner:"維里斯", name:"維里斯/兔寶", race:"兔男"},
  {owner:"塔維安", name:"埃爾諾", race:"兔男"},
  {owner:"雞湯", name:"伊利斯", race:"兔男"},
  {owner:"雞湯", name:"瓦諾", race:"貓男"},
  {owner:"雞湯", name:"小火龍", race:"龍女"},
  {owner:"雞湯", name:"敏瑟蘭/薄荷", race:"男精"},
  {owner:"伊里特", name:"伊醬", race:"兔男"},
  {owner:"S", name:"萊爾", race:"兔男"},
  {owner:"S", name:"拉恩", race:"貓男"},
  {owner:"kari", name:"柯瑟莉亞 · 沃恩", race:"龍女"},
];
const SHEET_ID = "1bLLdaiUOdhQf9qHReg1N2fknEhCBU4TOJmwATcwbIMg";

let data = SNAPSHOT.slice();
let active = 0; // 0 = 全部

function raceClass(r){
  if(r.includes("龍"))return"r-dragon";
  if(r.includes("兔"))return"r-rabbit";
  if(r.includes("貓"))return"r-cat";
  if(r.includes("精"))return"r-elf";
  return"r-other";
}
function raceVar(r){
  if(r.includes("龍"))return"var(--dragon)";
  if(r.includes("兔"))return"var(--rabbit)";
  if(r.includes("貓"))return"var(--cat)";
  if(r.includes("精"))return"var(--elf)";
  return"var(--accent)";
}
function initial(name){
  const ch=[...name].find(c=>/[^\s\/·.。、,，]/.test(c));
  return ch||"?";
}
function owners(){
  const seen=[];for(const d of data){if(!seen.includes(d.owner))seen.push(d.owner);}return seen;
}

function renderTabs(){
  const os=owners();
  const tabs=document.getElementById("tabs");
  const mk=(label,count,idx)=>`<button class="tab" role="tab" aria-selected="${active===idx}" onclick="select(${idx})">${label}<span class="c">${count}</span></button>`;
  let html=mk("全部",data.length,0);
  os.forEach((o,i)=>{html+=mk(o,data.filter(d=>d.owner===o).length,i+1);});
  tabs.innerHTML=html;
}
function renderGrid(){
  const os=owners();
  const list = active===0 ? data : data.filter(d=>d.owner===os[active-1]);
  const grid=document.getElementById("grid");
  grid.innerHTML=list.map(d=>`
    <div class="card">
      <div class="ava" style="background:linear-gradient(135deg,${raceVar(d.race)},${raceVar(d.race)}99)">${initial(d.name)}</div>
      <div class="name">${esc(d.name)}</div>
      <div class="badge ${raceClass(d.race)}">${esc(d.race)}</div>
      ${active===0?`<div class="owner">家長 · <span>${esc(d.owner)}</span></div>`:""}
    </div>`).join("");
}
function renderStats(){
  document.getElementById("st-char").textContent=data.length;
  document.getElementById("st-owner").textContent=owners().length;
  document.getElementById("st-race").textContent=new Set(data.map(d=>raceClass(d.race))).size;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function select(i){active=i;renderTabs();renderGrid();try{location.hash="t"+i;}catch(e){}}
function renderAll(){renderStats();renderTabs();renderGrid();}

// 一個小 CSV 解析器(處理引號)
function parseCSV(text){
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c=='"'){if(text[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c=='"')q=true;else if(c==',')	{row.push(f);f="";}
      else if(c=='\n'){row.push(f);rows.push(row);row=[];f="";}
      else if(c=='\r'){}else f+=c;}}
  if(f.length||row.length){row.push(f);rows.push(row);}
  return rows;
}
function buildFromRows(rows){
  let start=rows.findIndex(r=>r.some(c=>c&&c.includes("家長")));
  if(start<0)return null;
  const out=[];let owner="";
  for(let i=start+1;i<rows.length;i++){
    const r=rows[i];const o=(r[0]||"").trim(),n=(r[1]||"").trim(),race=(r[2]||"").trim();
    if(o)owner=o;
    if(!race&&!n){continue;}
    out.push({owner:owner,name:n||owner,race:race||"未填"});
  }
  return out.length?out:null;
}
// 部署到 GitHub Pages 後會成功(artifact 沙盒會擋外部連線,靜默用快照)。
async function tryLive(){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=0`;
    const res=await fetch(url);if(!res.ok)throw 0;
    const built=buildFromRows(parseCSV(await res.text()));
    if(built&&built.length){data=built;active=0;renderAll();
      document.getElementById("live").classList.add("on");
      document.getElementById("src-txt").textContent="即時讀取自 Google 試算表";}
  }catch(e){/* 保持快照 */}
}

renderAll();
try{const m=(location.hash||"").match(/^#t(\d+)$/);if(m)active=+m[1];}catch(e){}
renderAll();
tryLive();
</script>
