<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>角色名冊</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome 圖示庫 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=Noto+Serif+TC:wght@400;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <!-- 自訂樣式 -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body id="appBody" class="bg-library-paper min-h-screen font-serif text-stone-900 p-4 sm:p-6 relative pb-24 transition-all duration-700">

  <!-- 1. 頂部工具列 -->
  <header id="headerBg" class="max-w-7xl mx-auto mb-6 flex flex-wrap items-center justify-between gap-4 p-4 rounded-md shadow-md border-2 border-amber-900/30 bg-[#fbf5e6] transition-all">
    <div class="flex items-center gap-3">
      <i id="headerIcon" class="fa-solid fa-book-bookmark text-2xl text-amber-800"></i>
      <h1 id="headerTitle" class="text-xl font-bold tracking-wide">角色檔案館</h1>
    </div>

    <div class="flex flex-wrap items-center gap-4">
      <!-- 版型選擇 -->
      <div class="flex items-center gap-2">
        <label for="themeSelector" class="text-xs font-bold opacity-80"><i class="fa-solid fa-palette mr-1"></i>版型：</label>
        <select id="themeSelector" onchange="switchTheme(this.value)" class="bg-[#f4ebd0] border-2 border-amber-900/40 text-amber-950 text-xs rounded block p-2 outline-none cursor-pointer shadow-sm font-bold transition-all">
          <option value="retro">📜 圖書館大書</option>
          <option value="cyber">⚡ 賽博通緝牆</option>
          <option value="white">⚪ 極簡純白</option>
          <option value="dark">⚫ 極致純黑</option>
        </select>
      </div>

      <!-- 家長篩選 -->
      <div class="flex items-center gap-2">
        <label for="parentFilter" class="text-xs font-bold opacity-80"><i class="fa-solid fa-filter mr-1"></i>家長：</label>
        <select id="parentFilter" onchange="filterCards()" class="bg-[#f4ebd0] border-2 border-amber-900/40 text-amber-950 text-xs rounded block p-2 outline-none cursor-pointer shadow-sm font-bold transition-all">
          <option value="ALL">全部顯示</option>
        </select>
      </div>
    </div>
  </header>

  <!-- 2. 列表區域 -->
  <main class="max-w-7xl mx-auto" id="mainContainer">

    <!-- 模式 A：圖書館大書 (每頁左右各 9 筆，共 18 筆) -->
    <div id="bookView" class="w-full bg-[#fbf5e6] border-4 border-amber-900/40 rounded-sm shadow-2xl p-6 md:p-10 relative">
      <div class="absolute inset-y-0 left-1/2 w-12 -ml-6 bg-gradient-to-r from-transparent via-amber-950/20 to-transparent pointer-events-none z-10 hidden md:block"></div>

      <div id="bookPagesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-8 lg:gap-12 book-page-turn">
        <div class="pr-0 md:pr-6 border-b md:border-b-0 md:border-r border-amber-900/20 pb-6 md:pb-0 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center pb-2 border-b-2 border-amber-900/30 mb-4">
              <span class="text-xs text-amber-900 font-bold tracking-widest"><i class="fa-solid fa-book-open mr-1"></i> FOLIO LEFT ― 檔案卷宗左頁</span>
            </div>
            <div id="leftBookGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
          </div>
        </div>
        <div class="pl-0 md:pl-6 flex flex-col justify-between">
          <div>
            <div class="flex justify-between items-center pb-2 border-b-2 border-amber-900/30 mb-4">
              <span class="text-xs text-amber-900 font-bold tracking-widest"><i class="fa-solid fa-book-open mr-1"></i> FOLIO RIGHT ― 檔案卷宗右頁</span>
            </div>
            <div id="rightBookGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
          </div>
        </div>
      </div>

      <div class="flex justify-between items-center pt-6 border-t-2 border-amber-900/30 mt-8 text-xs font-bold text-amber-900">
        <button onclick="prevBookPage()" class="hover:text-amber-600 flex items-center gap-1 transition px-3 py-1.5 bg-amber-900/10 rounded"><i class="fa-solid fa-chevron-left"></i> 上一頁</button>
        <span id="pageIndicator" class="tracking-widest text-sm font-black">PAGE 1 / 1</span>
        <button onclick="nextBookPage()" class="hover:text-amber-600 flex items-center gap-1 transition px-3 py-1.5 bg-amber-900/10 rounded">下一頁 <i class="fa-solid fa-chevron-right"></i></button>
      </div>
    </div>

    <!-- 模式 B、C、D：網格列表 -->
    <div id="gridView" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8"></div>
  </main>

  <!-- 3. 右下角浮動新增按鈕 -->
  <button id="fabBtn" onclick="openAddModal()" class="fixed bottom-6 right-6 z-40 bg-amber-800 text-amber-100 w-14 h-14 rounded-lg shadow-2xl border-2 border-amber-600 flex items-center justify-center text-xl active:scale-95 transition-all">
    <i id="fabIcon" class="fa-solid fa-plus"></i>
  </button>

  <!-- 4. 詳情彈窗：上面設定、下面故事 -->
  <div id="cardModal" class="fixed inset-0 z-50 bg-stone-950/80 backdrop-blur-md hidden items-center justify-center p-4">
    <button onclick="closeModal('cardModal')" class="absolute top-6 right-6 text-white text-3xl hover:text-amber-400 transition z-50"><i class="fa-solid fa-xmark"></i></button>
    <div id="modalBox" class="w-full max-w-lg h-[480px] bg-stone-50 rounded-xl shadow-2xl p-6 border-2 border-stone-300 flex flex-col justify-between relative transition-all">
      <div class="flex items-center justify-between border-b pb-3 mb-4">
        <div>
          <h2 id="modalName" class="text-xl font-bold">角色名字</h2>
          <p id="modalSubInfo" class="text-xs font-medium mt-0.5 opacity-80">種族：- ｜ 家長：-</p>
        </div>
        <span class="text-[10px] uppercase font-bold tracking-widest opacity-60 px-2 py-1 rounded bg-stone-200/50">Details</span>
      </div>
      <div class="flex-1 flex flex-col gap-4 overflow-hidden">
        <div id="modalTopBox" class="bg-white p-3.5 rounded-lg border border-stone-200 shadow-sm text-xs">
          <div class="font-bold border-b pb-1.5 mb-2"><i class="fa-solid fa-sliders text-amber-600 mr-1"></i>角色設定</div>
          <p id="modalSetting" class="leading-relaxed whitespace-pre-wrap overflow-y-auto pr-1 custom-scrollbar" style="max-height:120px">-</p>
        </div>
        <div id="modalBottomBox" class="bg-white p-3.5 rounded-lg border border-stone-200 shadow-sm text-xs flex-1 flex flex-col overflow-hidden">
          <div class="font-bold border-b pb-1.5 mb-2"><i class="fa-solid fa-book-open mr-1"></i>背景故事</div>
          <p id="modalStory" class="leading-relaxed whitespace-pre-wrap overflow-y-auto pr-1 custom-scrollbar">故事載入中...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- 5. 新增 / 編輯角色 Modal -->
  <div id="formModal" class="fixed inset-0 z-50 bg-stone-950/80 backdrop-blur-md hidden items-center justify-center p-4">
    <button onclick="closeModal('formModal')" class="absolute top-6 right-6 text-white text-3xl hover:text-amber-400 transition z-50"><i class="fa-solid fa-xmark"></i></button>
    <div id="formModalBox" class="w-full max-w-lg bg-[#fbf5e6] rounded-md shadow-2xl p-6 border-4 border-amber-900/40 flex flex-col gap-4 relative max-h-[90vh] overflow-y-auto transition-all text-stone-900">
      <h2 id="formModalTitle" class="text-xl font-bold border-b pb-2">新增角色</h2>
      <form id="characterForm" onsubmit="handleFormSubmit(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="editIndex" value="-1">

        <!-- 角色名 -->
        <div>
          <label class="block font-bold mb-1">角色名 / 綽號：</label>
          <input type="text" id="formName" required placeholder="例如：淡皋" class="form-input w-full p-2 rounded outline-none transition-all">
        </div>

        <!-- 家長 & 種族 -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block font-bold mb-1">家長：</label>
            <input type="text" id="formParent" placeholder="例如：77" class="form-input w-full p-2 rounded outline-none transition-all">
          </div>
          <div>
            <label class="block font-bold mb-1">種族：</label>
            <input type="text" id="formRace" placeholder="例如：兔男、龍女" class="form-input w-full p-2 rounded outline-none transition-all">
          </div>
        </div>

        <!-- 頭貼上傳 -->
        <div>
          <label class="block font-bold mb-1">頭貼（上傳圖片，留空則用預設圖）：</label>
          <div class="flex items-center gap-2">
            <input type="file" id="formFileInput" accept="image/*" onchange="handleFileUpload(event)" class="hidden">
            <button type="button" onclick="document.getElementById('formFileInput').click()" id="uploadBtn" class="form-btn px-3 py-2 rounded font-bold transition shrink-0"><i class="fa-solid fa-upload mr-1"></i>選擇檔案</button>
            <input type="text" id="formImg" placeholder="或貼上圖片網址 https://..." class="form-input w-full p-2 rounded outline-none transition-all">
          </div>
          <div id="imagePreviewContainer" class="mt-2 hidden items-center gap-2">
            <img id="imagePreview" src="" class="w-12 h-12 object-cover rounded border border-amber-900/30">
            <span class="text-[10px] opacity-70">圖片已選取</span>
          </div>
        </div>

        <!-- 設定 -->
        <div>
          <label class="block font-bold mb-1">設定（年齡 / 個性 / 特徵等）：</label>
          <textarea id="formSetting" rows="2" placeholder="例如：外表年齡 20 / 沉靜寡言 / 喜歡甜食" class="form-input w-full p-2 rounded outline-none custom-scrollbar transition-all"></textarea>
        </div>

        <!-- 故事 -->
        <div>
          <label class="block font-bold mb-1">故事：</label>
          <textarea id="formStory" rows="4" placeholder="角色的背景故事與經歷..." class="form-input w-full p-2 rounded outline-none custom-scrollbar transition-all"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-3 border-t border-stone-300/40">
          <button type="button" onclick="closeModal('formModal')" id="cancelBtn" class="px-4 py-2 rounded font-bold transition">取消</button>
          <button type="submit" id="saveBtn" class="px-5 py-2 rounded font-bold shadow transition">儲存角色</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 6. 刪除確認 Modal -->
  <div id="deleteModal" class="fixed inset-0 z-50 bg-stone-950/80 backdrop-blur-md hidden items-center justify-center p-4">
    <div id="deleteModalBox" class="w-full max-w-sm rounded-xl shadow-2xl p-6 text-center space-y-4 border transition-all">
      <div class="text-rose-500 text-4xl"><i class="fa-solid fa-triangle-exclamation"></i></div>
      <h3 class="text-lg font-bold">確定要刪除此角色？</h3>
      <p id="deleteTargetName" class="text-xs font-bold opacity-80">角色名稱</p>
      <div class="flex justify-center gap-3 pt-2">
        <button onclick="closeModal('deleteModal')" id="deleteCancelBtn" class="px-4 py-2 rounded font-bold text-xs transition">取消</button>
        <button onclick="executeDelete()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded font-bold text-xs shadow transition">確認刪除</button>
      </div>
    </div>
  </div>

  <!-- 腳本:先載 Supabase,再載設定,最後載邏輯 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
